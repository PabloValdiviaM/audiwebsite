server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para acelerar la carga de assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Soporte para rutas limpias de Astro y View Transitions
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    # Caché inmutable de 1 año para los 240 fotogramas WebP y assets generados
    location ~* \.(?:webp|jpg|jpeg|gif|png|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Streaming optimizado para videos MP4 (soporte nativo de byte-range requests)
    location ~* \.(?:mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Manejo de error 404
    error_page 404 /404.html;
}
